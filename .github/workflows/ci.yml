name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: "1.25"
          cache: true

      - name: Verify formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      # Regression test for .gitignore itself. An unanchored "mail-mcp" rule
      # once matched the cmd/mail-mcp/ directory, so `git add cmd` was a
      # silent no-op and a commit shipped with no package main. check-ignore
      # works on hypothetical paths, so this catches the rule before a file
      # exists to be lost.
      - name: Verify ignore rules do not swallow source
        run: |
          status=0
          for path in \
            cmd/mail-mcp/main.go \
            internal/config/testdata/config.yml \
            internal/mailmime/testdata/sample.out \
            internal/tools/testdata/golden.yml
          do
            if git check-ignore -q "$path"; then
              echo "::error::.gitignore would silently swallow $path"
              status=1
            fi
          done
          exit $status

      - name: Verify go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - run: go vet ./...

      - run: go build ./...

      # Build and run the actual binary, not just the packages. `go build ./...`
      # stays green even if cmd/ is missing entirely, which is exactly how the
      # entrypoint once got left out of a commit.
      - name: Build and smoke-test the binary
        run: |
          go build -o /tmp/mail-mcp ./cmd/mail-mcp
          /tmp/mail-mcp --version

      - run: go test -race -coverprofile=coverage.out ./...

      - name: Report coverage
        run: go tool cover -func=coverage.out | tail -1

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.25"
          cache: true
      # v8 is the first release that understands a version 2 config file.
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.6.2

  docker:
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: mail-mcp:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
